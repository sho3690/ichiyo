name: 頁を書く

on:
  schedule:
    - cron: "0 9 * * *"    # 18:00 JST — 明日の頁を用意する
    - cron: "0 12 * * *"   # 21:00 JST — 予備
    - cron: "0 18 * * *"   # 03:00 JST — 予備
    - cron: "0 20 * * *"   # 05:00 JST — 最後の確認（GitHub の定時実行は数時間遅れることがある）
  workflow_dispatch:
    inputs:
      date:
        description: "書く日付（YYYY-MM-DD）。空なら今日と明日"
        required: false
        default: ""

concurrency:
  group: write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claude Code を入れる
        run: npm install -g @anthropic-ai/claude-code

      - name: トークンと書き置きを確かめる
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          ahead=$(node -e '
            const L = require("./data/essays.json");
            const today = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(Date.now() - 7 * 3600000));
            const last = L.map(e => e.date).sort().pop();
            console.log(Math.round((Date.parse(last) - Date.parse(today)) / 86400000));
          ')
          echo "書き置きは今日から ${ahead} 日ぶん" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$ahead" -ge 3 ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN が未設定です。書き置きがあるうちは静かに見送ります。README の手順で Secrets に登録してください"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN が未設定で、書き置きが残り ${ahead} 日です。README の手順で Secrets に登録してください"
            exit 1
          fi

      - name: 頁を書く
        if: steps.token.outputs.ok == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATE: ${{ inputs.date }}
        run: node scripts/write-tomorrow.mjs ${DATE:+--date "$DATE"}

      - name: 記録をコミット
        if: steps.token.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/essays.json
          if git diff --staged --quiet; then
            echo "新しい頁はありません"
          else
            git commit -m "頁を追加 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi
