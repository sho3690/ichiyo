name: 頁を書く

on:
  schedule:
    - cron: "0 12 * * *"   # 21:00 JST — 明日の頁を用意する
    - cron: "0 21 * * *"   # 06:00 JST — 念のため今日の頁を確かめる
  workflow_dispatch:
    inputs:
      date:
        description: "書く日付（YYYY-MM-DD）。空なら今日と明日"
        required: false
        default: ""

concurrency:
  group: write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claude Code を入れる
        run: npm install -g @anthropic-ai/claude-code

      - name: トークンを確かめる
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN が設定されていません。README の手順で Secrets に登録してください"
            exit 1
          fi

      - name: 頁を書く
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATE: ${{ inputs.date }}
        run: node scripts/write-tomorrow.mjs ${DATE:+--date "$DATE"}

      - name: 記録をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/essays.json
          if git diff --staged --quiet; then
            echo "新しい頁はありません"
          else
            git commit -m "頁を追加 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi
