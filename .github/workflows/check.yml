name: 朝の確認

on:
  schedule:
    - cron: "10 22 * * *"   # 07:10 JST — 今日の頁が公開サイトから読めるか確かめる
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 公開サイトに今日の頁があるか
        run: |
          today=$(TZ=Asia/Tokyo date -d '-7 hours' +%Y-%m-%d)
          stamp=$(date +%s)
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://sho3690.github.io/ichiyo/?c=$stamp")
          if [ "$code" != "200" ]; then
            echo "::error::サイトが開けません（HTTP $code）"; exit 1
          fi
          data=$(curl -s "https://sho3690.github.io/ichiyo/data/essays.json?c=$stamp")
          title=$(printf '%s' "$data" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const L=JSON.parse(s); const e=L.find(x=>x.date===process.argv[1]);
              process.stdout.write(e ? e.title : "");
            });' "$today")
          if [ -z "$title" ]; then
            echo "::error::$today の頁が公開サイトにありません。Actions「頁を書く」の失敗か、CLAUDE_CODE_OAUTH_TOKEN の未設定が原因です"; exit 1
          fi
          last=$(printf '%s' "$data" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const L=JSON.parse(s);process.stdout.write(L.map(x=>x.date).sort().pop());})')
          echo "$today の頁「$title」が公開されています。書き置きは $last まで。" | tee -a "$GITHUB_STEP_SUMMARY"
