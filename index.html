<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ichiyō</title>
<meta name="description" content="One page a day. A short Japanese essay of about five hundred characters, and only the page for today.">
<meta name="theme-color" content="#1b1916">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ichiyō">
<meta property="og:title" content="Ichiyō">
<meta property="og:description" content="One page a day. A short Japanese essay of about five hundred characters.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Shippori+Mincho:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#1b1916;
  --surface:#23201b;
  --surface-2:#2c2822;
  --ink:#ebe3d3;
  --ink-2:#b4aa97;
  --ink-3:#847b6c;
  --gold:#c9a961;
  --line:#37322b;
  --serif-jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --serif-lat:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --col:440px;
}
html{color-scheme:dark;background:var(--ground)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif-jp);font-size:16px;line-height:1.6;padding-inline:max(20px,env(safe-area-inset-left),env(safe-area-inset-right));padding-block:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:2px}
.page{max-width:var(--col);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.link{font-family:var(--serif-lat);font-size:15px;font-weight:500;font-style:normal;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);padding-block:6px}
.link:hover{color:var(--ink)}
main{flex:1;display:flex;flex-direction:column}
.fade{animation:rise .8s cubic-bezier(.2,.6,.2,1) both}
@keyframes rise{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.dot{animation:none}}

/* 今日の頁 */
.leaf{padding-block:calc(64px + env(safe-area-inset-top)) 56px;display:flex;flex-direction:column;align-items:flex-start}
.date{margin:0;font-family:var(--serif-lat);font-style:italic;font-weight:300;font-size:23px;letter-spacing:.01em;line-height:1.2;color:var(--ink-2)}
.art{margin-top:38px;max-width:100%;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 28%,var(--surface-2) 0%,var(--surface) 52%,var(--ground) 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.art.f-arch{width:min(300px,100%);aspect-ratio:4/5;border-radius:50% 50% 14px 14px / 40% 40% 14px 14px}
.art.f-tondo{width:min(300px,100%);aspect-ratio:1/1;border-radius:50%}
.art.f-tall{width:min(260px,86%);aspect-ratio:2/3;border-radius:3px;outline:1px solid var(--line);outline-offset:6px;margin-top:44px}
.art.f-square{width:min(300px,100%);aspect-ratio:1/1;border-radius:14px}
.art.f-wide{width:100%;aspect-ratio:3/2;border-radius:10px}
.art canvas{display:block;width:100%;height:100%}
.art .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.title{font-size:33px;font-weight:500;line-height:1.3;letter-spacing:.05em;margin:44px 0 0;text-wrap:balance}
.title.quiet{font-family:var(--serif-lat);font-size:22px;font-weight:400;font-style:italic;color:var(--ink-2);letter-spacing:.02em}
.rule{width:40px;height:1px;background:var(--gold);border:0;margin:24px 0 30px}
.body{width:100%}
.body p{margin:0;text-indent:1em;font-size:17px;line-height:2.05;text-align:justify;letter-spacing:.02em;line-break:strict;overflow-wrap:anywhere;color:var(--ink)}
.note{margin:0;font-family:var(--serif-lat);font-size:17px;line-height:1.6;color:var(--ink-2);letter-spacing:.01em}
.foot{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);width:100%;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 24px;font-family:var(--serif-lat);font-style:italic;font-size:16px;letter-spacing:.03em;color:var(--ink-3)}
.foot p{margin:0}
.retry{margin-top:32px;font-family:var(--serif-lat);font-size:15px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);padding:12px 22px;border-radius:6px}
.retry:hover{border-color:var(--gold)}

/* 書庫 */
.shelf{padding-block:calc(40px + env(safe-area-inset-top)) 56px}
.shelf .back{display:inline-block;margin-bottom:40px}
.shelf h2{font-family:var(--serif-lat);font-size:14px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:500;margin:0 0 10px}
.shelf .count{margin:0 0 30px;display:flex;align-items:baseline;gap:10px}
.shelf .count .n{font-family:var(--serif-lat);font-style:italic;font-weight:300;font-size:34px;line-height:1;color:var(--ink)}
.shelf .count .u{font-family:var(--serif-lat);font-style:italic;font-size:17px;letter-spacing:.02em;color:var(--ink-2)}
.shelf ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.shelf li{border-bottom:1px solid var(--line)}
.row{width:100%;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:16px;padding-block:16px;text-align:left}
.row .k{border:1px solid var(--line);background:var(--surface);overflow:hidden;position:relative;justify-self:center}
.row .k.f-arch{width:44px;height:54px;border-radius:22px 22px 6px 6px}
.row .k.f-tondo{width:46px;height:46px;border-radius:50%}
.row .k.f-tall{width:38px;height:54px;border-radius:2px;outline:1px solid var(--line);outline-offset:2px}
.row .k.f-square{width:46px;height:46px;border-radius:5px}
.row .k.f-wide{width:56px;height:36px;border-radius:4px}
.row .k canvas{display:block;width:100%;height:100%}
.row .t{font-size:17px;letter-spacing:.05em;color:var(--ink)}
.row .d{font-family:var(--serif-lat);font-style:italic;font-size:17px;color:var(--ink-3);white-space:nowrap}
.row:hover .t,.row:hover .d{color:var(--gold)}
.row.today .d::after{content:"today";margin-inline-start:.6em;font-size:12px;letter-spacing:.12em;color:var(--gold)}
.shelf .empty{margin:0;font-family:var(--serif-lat);font-style:italic;font-size:17px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="page">
  <main id="view" aria-live="polite"></main>
</div>

<script src="art.js"></script>
<script>
(function(){
  'use strict';

  // ---------- 暦 ----------
  var WD_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MON_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MON_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function latDate(d){return WD_EN[d.getDay()]+', '+d.getDate()+' '+MON_EN[d.getMonth()]+' '+d.getFullYear();}
  function shortDate(d){return d.getDate()+' '+MON_SHORT[d.getMonth()];}
  // 日本時間での今日（YYYY-MM-DD）
  function todayJST(){
    try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
    catch(e){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  }

  // ---------- 状態 ----------
  var todayKey=todayJST();
  var essays={};          // date -> essay（今日以前のものだけ）
  var view='today';       // today | shelf | past

  var $view=document.getElementById('view');

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function clear(){while($view.firstChild)$view.removeChild($view.firstChild);}
  function setView(v){view=v;window.scrollTo({top:0});}
  function link(text,onClick){var b=el('button','link',text);b.type='button';b.addEventListener('click',onClick);return b;}
  function isValid(d){return !!d&&typeof d.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.date)&&typeof d.title==='string'&&typeof d.kanji==='string'&&typeof d.body==='string'&&d.body.length>0;}
  function sortedKeys(){return Object.keys(essays).sort().reverse();}
  function setHash(h){try{if(h){history.replaceState(null,'','#'+h);}else{history.replaceState(null,'',location.pathname+location.search);}}catch(e){}}
  var THUMB={arch:[44,54],tondo:[46,46],tall:[38,54],square:[46,46],wide:[56,36]};
  function planOf(e){try{if(window.IchiyoArt)return window.IchiyoArt.plan(e.date,e.kanji);}catch(err){} return {frame:'arch',light:false};}
  function paint(canvas,e,w,h){try{if(window.IchiyoArt)window.IchiyoArt.draw(canvas,e.date,e.kanji,w,h);}catch(err){}}

  // ---------- 描画 ----------
  function renderLeaf(e,opts){
    opts=opts||{};
    clear();setView(opts.past?'past':'today');
    setHash(opts.past?e.date:'');
    var d=parseKey(e.date);
    var art=el('article','leaf fade');
    art.appendChild(el('p','date',latDate(d)));
    if(opts.note){var n=el('p','note',opts.note);n.style.marginTop='28px';art.appendChild(n);}
    var pl=planOf(e);
    var arch=el('div','art f-'+pl.frame+(pl.light?' light':''));
    var cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');arch.appendChild(cv);
    arch.setAttribute('role','img');arch.setAttribute('aria-label','Artwork of the day');
    art.appendChild(arch);
    art.appendChild(el('h1','title',e.title));
    art.appendChild(el('hr','rule'));
    var body=el('div','body');
    e.body.split('\n').forEach(function(p){p=p.trim();if(p)body.appendChild(el('p',null,p));});
    art.appendChild(body);
    var foot=el('footer','foot');
    if(!opts.past&&e.date===todayKey){foot.appendChild(el('p',null,'The next page arrives tomorrow.'));foot.appendChild(link('Library',renderShelf));}
    else{foot.appendChild(link('Library',renderShelf));foot.appendChild(link('Today',showToday));}
    art.appendChild(foot);
    $view.appendChild(art);
    var rect=arch.getBoundingClientRect();
    paint(cv,e,Math.max(1,Math.round(rect.width)),Math.max(1,Math.round(rect.height)));
  }

  function renderQuiet(text,sub){
    clear();setView('today');
    var art=el('article','leaf fade');
    var d=parseKey(todayKey);
    art.appendChild(el('p','date',latDate(d)));
    var arch=el('div','art f-arch');arch.appendChild(el('span','dot'));art.appendChild(arch);
    art.appendChild(el('h1','title quiet',text));
    if(sub){var n=el('p','note',sub);n.style.marginTop='18px';art.appendChild(n);}
    $view.appendChild(art);
    return art;
  }

  function renderShelf(){
    clear();setView('shelf');setHash('');
    var sec=el('section','shelf fade');
    var back=link('Today',showToday);back.classList.add('back');sec.appendChild(back);
    sec.appendChild(el('h2',null,'Library'));
    var keys=sortedKeys();
    var count=el('p','count');
    count.appendChild(el('span','n',String(keys.length)));
    count.appendChild(el('span','u',(keys.length===1?'page':'pages')+' · one a day'));
    sec.appendChild(count);
    if(!keys.length){sec.appendChild(el('p','empty','No pages yet.'));$view.appendChild(sec);return;}
    var ol=el('ol');
    keys.forEach(function(k){
      var e=essays[k],li=el('li'),b=el('button','row'+(k===todayKey?' today':''));
      b.type='button';
      var pk=planOf(e),tw=THUMB[pk.frame]||THUMB.arch;var kb=el('span','k f-'+pk.frame+(pk.light?' light':''));var kc=document.createElement('canvas');kc.setAttribute('aria-hidden','true');kb.appendChild(kc);b.appendChild(kb);paint(kc,e,tw[0],tw[1]);
      b.appendChild(el('span','t',e.title));
      b.appendChild(el('span','d',shortDate(parseKey(k))));
      b.addEventListener('click',function(){renderLeaf(e,{past:k!==todayKey});});
      li.appendChild(b);ol.appendChild(li);
    });
    sec.appendChild(ol);
    $view.appendChild(sec);
  }

  function showToday(){
    if(essays[todayKey]){renderLeaf(essays[todayKey]);return;}
    var keys=sortedKeys();
    if(keys.length){renderLeaf(essays[keys[0]],{past:true,note:'Today’s page has not arrived yet. Here is the most recent one.'});return;}
    renderQuiet('No pages yet.');
  }

  // ---------- 起動 ----------
  function load(){
    renderQuiet('Opening the page.');
    var url='data/essays.json?d='+todayKey.replace(/-/g,'');
    return fetch(url,{cache:'no-cache'}).then(function(r){
      if(!r.ok)throw new Error('http '+r.status);
      return r.json();
    }).then(function(list){
      if(!Array.isArray(list))throw new Error('shape');
      list.forEach(function(d){if(isValid(d)&&d.date<=todayKey)essays[d.date]=d;});
      var h=(location.hash||'').replace('#','');
      if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&essays[h]&&h!==todayKey){renderLeaf(essays[h],{past:true});return;}
      showToday();
    }).catch(function(){
      var art=renderQuiet('The page could not be opened.','Check your connection and try again.');
      var b=el('button','retry','Try again');b.type='button';b.addEventListener('click',load);
      art.appendChild(b);
    });
  }

  load();
})();
</script>
</body>
</html>
